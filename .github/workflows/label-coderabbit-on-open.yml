name: Trigger CodeRabbit on PR open and push
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  trigger-coderabbit:
    runs-on: ubuntu-latest
    steps:
      # PR オープン時は CodeRabbit ラベルを付与して初回レビューを起動する
      - name: Add CodeRabbit label on open
        if: github.event.action == 'opened'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: CodeRabbit

      # push（synchronize）や reopen のたびに @coderabbitai review で再レビューを起動する
      - name: Request CodeRabbit review on push
        if: github.event.action == 'synchronize' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "@coderabbitai review"
