[project]
name = "backend"
version = "0.1.0"
description = "kyunpass FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
